<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Röplabda Meccs Elemző</title>
  <!--
    Volleyball drawn the way the 🏐 glyph reads: three long seams that all curve
    the same way and cross each other, which is what makes a ball look like a
    volleyball rather than a pie chart. Only the black contour is drawn — the
    outer ring and the seams — over three flag-coloured sectors.

    Geometry: centre 32,32, radius 28. Each seam is a cubic from the rim at
    angle a to the rim at a+200°, with both control points at 55% radius, and
    the set is repeated every 120°. Stroke widths were chosen by rendering at
    16px, where thinner seams disappear and thicker ones close up the panels.
  -->
  <clipPath id="ball"><circle cx="32" cy="32" r="28"/></clipPath>

  <!-- panels -->
  <g clip-path="url(#ball)">
    <path d="M32 32 L56.25 18.0 A28 28 0 0 1 32.0 60.0 Z" fill="#CD2A3E"/><!-- piros -->
    <path d="M32 32 L32.0 60.0 A28 28 0 0 1 7.75 18.0 Z" fill="#FFFFFF"/><!-- fehér -->
    <path d="M32 32 L7.75 18.0 A28 28 0 0 1 56.25 18.0 Z" fill="#436F4D"/><!-- zöld -->
  </g>

  <!-- black contour: seams inside the ball, then the rim -->
  <g fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round" clip-path="url(#ball)">
    <path d="M32.0 4.0 C45.34 24.3 41.9 43.8 22.42 58.31"/>
    <path d="M56.25 46.0 C32.0 47.4 16.83 34.67 14.0 10.55"/>
    <path d="M7.75 46.0 C18.66 24.3 37.27 17.53 59.57 27.14"/>
  </g>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#000000" stroke-width="3.4"/>
</svg>
