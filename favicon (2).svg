<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Röplabda Meccs Elemző</title>
  <!--
    Volleyball in the panel style of the reference artwork: three groups of
    curved bands separated by gaps, meeting in a pinwheel, rather than thin
    seam lines. The groups carry the Hungarian flag colours.

    How it is drawn: each group is a set of concentric circles struck around a
    pivot that sits OUTSIDE the ball, along the middle of that group's
    120-degree wedge. Clipping the strokes to the wedge turns them into
    parallel bands sweeping across it; clipping the whole thing to the ball
    keeps the silhouette round. Pivot distance 50 and band offsets 1/11/21/31
    were tuned by rendering at 16px — wider gaps break the ball apart, tighter
    ones merge into a solid disc.
  -->
  <defs>
    <clipPath id="ball"><circle cx="32" cy="32" r="28"/></clipPath>
    <clipPath id="w0"><path d="M32 32 L32.00 -1.00 A33 33 0 0 1 60.58 48.50 Z"/></clipPath>
    <clipPath id="w1"><path d="M32 32 L60.58 48.50 A33 33 0 0 1 3.42 48.50 Z"/></clipPath>
    <clipPath id="w2"><path d="M32 32 L3.42 48.50 A33 33 0 0 1 32.00 -1.00 Z"/></clipPath>
  </defs>

  <circle cx="32" cy="32" r="28" fill="#0a1424"/>
  <g clip-path="url(#ball)">
    <g clip-path="url(#w0)" fill="none" stroke="#CD2A3E" stroke-width="6.0"><circle cx="75.30" cy="7.00" r="49"/><circle cx="75.30" cy="7.00" r="39"/><circle cx="75.30" cy="7.00" r="29"/><circle cx="75.30" cy="7.00" r="19"/></g><!-- piros -->
    <g clip-path="url(#w1)" fill="none" stroke="#FFFFFF" stroke-width="6.0"><circle cx="32.00" cy="82.00" r="49"/><circle cx="32.00" cy="82.00" r="39"/><circle cx="32.00" cy="82.00" r="29"/><circle cx="32.00" cy="82.00" r="19"/></g><!-- fehér -->
    <g clip-path="url(#w2)" fill="none" stroke="#436F4D" stroke-width="6.0"><circle cx="-11.30" cy="7.00" r="49"/><circle cx="-11.30" cy="7.00" r="39"/><circle cx="-11.30" cy="7.00" r="29"/><circle cx="-11.30" cy="7.00" r="19"/></g><!-- zöld -->
  </g>
</svg>
