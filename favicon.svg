<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Röplabda Meccs Elemző</title>
  <!--
    Volleyball built the same way the header icon reads: three curved seams
    meet at the centre and split the ball into three panels, filled with the
    Hungarian flag colours and outlined in black.

    Geometry: centre 32,32, radius 28. Panel edges sit at -90°, 30° and 150°.
    Each seam is a quadratic curve whose control point is one vector rotated
    by 120°, which keeps the pinwheel perfectly even. Stroke widths were
    picked by rendering at 16px — thinner seams smear together, thicker ones
    swallow the colours.
  -->
  <g>
    <!-- panels: red, white, green -->
    <path d="M32 32 Q51.0 19.0 32.0 4.0 A28 28 0 0 1 56.25 46.0 Q36.76 51.76 32 32 Z" fill="#CD2A3E"/>
    <path d="M32 32 Q36.76 51.76 56.25 46.0 A28 28 0 0 1 7.75 46.0 Q12.24 25.24 32 32 Z" fill="#FFFFFF"/>
    <path d="M32 32 Q12.24 25.24 7.75 46.0 A28 28 0 0 1 32.0 4.0 Q51.0 19.0 32 32 Z" fill="#436F4D"/>

    <!-- black contour: the three seams, then the outer ring on top -->
    <g fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round">
      <path d="M32 32 Q51.0 19.0 32.0 4.0"/>
      <path d="M32 32 Q36.76 51.76 56.25 46.0"/>
      <path d="M32 32 Q12.24 25.24 7.75 46.0"/>
    </g>
    <circle cx="32" cy="32" r="28" fill="none" stroke="#000000" stroke-width="3.4"/>
  </g>
</svg>
