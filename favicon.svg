<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Volleyball favicon. Drawn as vectors so it stays sharp at every size and
       needs no binary asset in the repo. -->
  <circle cx="32" cy="32" r="30" fill="#f0a500"/>
  <g fill="none" stroke="#0a1424" stroke-width="3.4" stroke-linecap="round">
    <circle cx="32" cy="32" r="30"/>
    <!-- three seams meeting near the centre, the classic volleyball pattern -->
    <path d="M32 2c-9 11-12 24-9 30 3 6 12 12 26 10"/>
    <path d="M4.5 21c13 3 23 10 26 17 3 7 2 17-6 22"/>
    <path d="M59 21c-13 3-23 10-26 17-3 7-2 17 6 22"/>
  </g>
</svg>
